<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Charges Predictor</title>
    <link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="img"></div>
<div class="container">
    <h2>Insurance Estimator</h2>
    <form id="predictionForm">
        <div class="form-group">
            <label>Age</label>
            <input type="number" min="0" id="age" placeholder="e.g. 25" required>
        </div>
        
        <div class="form-group">
            <label>Gender</label>
            <select id="sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label>BMI</label>
            <input type="number" step="0.01" id="bmi" placeholder="e.g. 28.5" required>
        </div>

        <div class="form-group">
               <label>Children</label>
              <input type="number" id="children" min="0" value="0">
        </div>
        
        <div class="form-group">
            <label>Smoker</label>
            <select id="smoker">
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Region</label>
            <select id="region">
                <option value="southeast">Southeast</option>
                <option value="southwest">Southwest</option>
                <option value="northeast">Northeast</option>
                <option value="northwest">Northwest</option>
            </select>
        </div>

        <button type="button" class="btn" onclick="onClickedEstimatePrice()">Calculate Charges</button>
    </form>

    <div id="result-container" class="result-hidden">
        <h3>Estimated Charges:</h3>
        <p id="uiEstimatedPrice">$ 0.00</p>
    </div>
</div>

<script src="./app.js"></script>
</body>
</html>
